<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines Provably Fair</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1f29;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        .header { margin-bottom: 15px; }
        .balance-box {
            font-size: 20px;
            background: #242c3d;
            padding: 8px 15px;
            border-radius: 8px;
            display: inline-block;
            font-weight: bold;
            color: #4caf50;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-width: 320px;
            margin: 15px auto;
            min-height: 320px; /* Фиксируем место под сетку */
        }
        .cell {
            aspect-ratio: 1;
            background-color: #2e394d;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            user-select: none;
        }
        .cell:active { transform: scale(0.95); }
        .cell.safe { background-color: #4caf50; }
        .cell.mine { background-color: #f44336; }
        .cell.disabled { pointer-events: none; opacity: 0.8; }
        .controls { margin-bottom: 15px; }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            max-width: 320px;
        }
        button:disabled { background-color: #4a5568; cursor: not-allowed; }
        #cashout-btn { background-color: #ff9800; display: none; }
        .fairness-box {
            background: #151a24;
            padding: 10px;
            border-radius: 6px;
            font-size: 11px;
            max-width: 320px;
            margin: 15px auto 0 auto;
            text-align: left;
            word-break: break-all;
        }
        .fairness-title { font-weight: bold; color: #90a4ae; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🔥 Verity Casino 🔥</h2>
        <div class="balance-box">💰 <span id="balance">1000</span></div>
    </div>

    <!-- Сетка сразу содержит блоки, чтобы не зависеть от динамического рендера JavaScript -->
    <div class="grid" id="grid">
        <div class="cell disabled" data-index="0">❓</div>
        <div class="cell disabled" data-index="1">❓</div>
        <div class="cell disabled" data-index="2">❓</div>
        <div class="cell disabled" data-index="3">❓</div>
        <div class="cell disabled" data-index="4">❓</div>
        <div class="cell disabled" data-index="5">❓</div>
        <div class="cell disabled" data-index="6">❓</div>
        <div class="cell disabled" data-index="7">❓</div>
        <div class="cell disabled" data-index="8">❓</div>
        <div class="cell disabled" data-index="9">❓</div>
        <div class="cell disabled" data-index="10">❓</div>
        <div class="cell disabled" data-index="11">❓</div>
        <div class="cell disabled" data-index="12">❓</div>
        <div class="cell disabled" data-index="13">❓</div>
        <div class="cell disabled" data-index="14">❓</div>
        <div class="cell disabled" data-index="15">❓</div>
        <div class="cell disabled" data-index="16">❓</div>
        <div class="cell disabled" data-index="17">❓</div>
        <div class="cell disabled" data-index="18">❓</div>
        <div class="cell disabled" data-index="19">❓</div>
        <div class="cell disabled" data-index="20">❓</div>
        <div class="cell disabled" data-index="21">❓</div>
        <div class="cell disabled" data-index="22">❓</div>
        <div class="cell disabled" data-index="23">❓</div>
        <div class="cell disabled" data-index="24">❓</div>
    </div>

    <div class="controls">
        <button id="start-btn">Начать игру (Ставка: 100)</button>
        <button id="cashout-btn">Забрать выигрыш</button>
    </div>

    <div class="fairness-box">
        <div class="fairness-title">🛡️ Provably Fair (Честная игра):</div>
        <div><strong>Текущий хэш раунда:</strong></div>
        <div id="round-hash" style="color: #ffeb3b; font-family: monospace;">Начните игру...</div>
        <div id="result-key" style="margin-top: 5px; color: #a5d6a7; display: none;"></div>
    </div>

    <script>
        // Инициализация Telegram
        let tg = null;
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.ready();
            if (tg.expand) tg.expand();
        }

        let balance = 1000;
        let bet = 100;
        let gameState = 'idle';
        let minesCount = 4;
        let board = [];
        let revealedCount = 0;
        let currentMultiplier = 1.0;

        const gridEl = document.getElementById('grid');
        const startBtn = document.getElementById('start-btn');
        const cashoutBtn = document.getElementById('cashout-btn');
        const hashEl = document.getElementById('round-hash');
        const keyEl = document.getElementById('result-key');
        const balanceEl = document.getElementById('balance');

        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash << 5) - hash + str.charCodeAt(i);
                hash |= 0;
            }
            return "sha_" + Math.abs(hash).toString(16) + btoa(str).substring(0, 8);
        }

        function resetGrid() {
            const cells = gridEl.children;
            for (let i = 0; i < cells.length; i++) {
                cells[i].className = 'cell'; // Активируем ячейки (убираем disabled)
                cells[i].innerText = '😐';
                cells[i].style.backgroundColor = '';
            }
        }

        function generateRound() {
            board = Array(25).fill(0);
            let placed = 0;
            while (placed < minesCount) {
                let idx = Math.floor(Math.random() * 25);
                if (board[idx] === 0) {
                    board[idx] = 1;
                    placed++;
                }
            }
            const roundSalt = Math.random().toString(36).substring(2, 10);
            const rawData = "mines:" + board.join(",") + "-" + roundSalt;
            hashEl.innerText = simpleHash(rawData);
            keyEl.style.display = 'none';
            keyEl.innerText = "Ключ проверки: " + rawData;
        }

        function startGame() {
            if (balance < bet) {
                if (tg) tg.showAlert("Не хватает баланса!");
                else alert("Не хватает баланса!");
                return;
            }
            balance -= bet;
            balanceEl.innerText = balance;
            
            gameState = 'playing';
            revealedCount = 0;
            currentMultiplier = 1.0;
            
            startBtn.disabled = true;
            cashoutBtn.style.display = 'block';
            cashoutBtn.innerText = `Забрать: ${bet}`;
            
            generateRound();
            resetGrid();
        }

        // Навешиваем клики на ячейки сразу
        const cells = gridEl.children;
        for (let i = 0; i < cells.length; i++) {
            cells[i].addEventListener('click', function() {
                if (gameState !== 'playing') return;
                const idx = parseInt(this.dataset.index);
                
                if (this.classList.contains('safe') || this.classList.contains('mine')) return;

                if (board[idx] === 1) {
                    this.classList.add('mine');
                    this.innerText = '💣';
                    endGame(false);
                } else {
                    this.classList.add('safe');
                    this.innerText = '😁';
                    revealedCount++;
                    
                    currentMultiplier += 0.35;
                    cashoutBtn.innerText = `Забрать: ${(bet * currentMultiplier).toFixed(0)}`;
                    
                    if (revealedCount === (25 - minesCount)) {
                        endGame(true);
                    }
                }
            });
        }

        function cashout() {
            if (gameState !== 'playing') return;
            balance += Math.floor(bet * currentMultiplier);
            balanceEl.innerText = balance;
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            endGame(true);
        }

        function endGame(isWin) {
            gameState = 'over';
            startBtn.disabled = false;
            cashoutBtn.style.display = 'none';
            keyEl.style.display = 'block';

            const cells = gridEl.children;
            board.forEach((val, i) => {
                cells[i].classList.add('disabled');
                if (val === 1) {
                    cells[i].innerText = '😡';
                    if(!isWin) cells[i].style.backgroundColor = '#5c2b2b';
                } else {
                    if (cells[i].innerText === '❓') cells[i].innerText = '💎';
                }
            });

            if (!isWin && tg && tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('error');
            }
        }

        startBtn.addEventListener('click', startGame);
        cashoutBtn.addEventListener('click', cashout);
    </script>
</body>
</html>
